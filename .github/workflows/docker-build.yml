name: Build and Publish Kaldi Docker Images (Docker Build Cloud)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. MUST log in to Docker Hub FIRST to authenticate with Docker Build Cloud
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKER_USER || 'tklwin' }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PAT }}

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 2. Connect to Docker Build Cloud AFTER login
      - name: Set up Docker Buildx (Docker Build Cloud)
        uses: docker/setup-buildx-action@v3
        with:
          version: "lab:latest"
          driver: cloud
          endpoint: "tklwin/clb"

      # 3. Fast build and push executed on Docker Build Cloud (~3-5 mins)
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            tklwin/kaldi-apple-silicon:latest
            tklwin/kaldi-apple-silicon:arm64
            ghcr.io/${{ github.repository_owner }}/kaldi-apple-silicon:latest
            ghcr.io/${{ github.repository_owner }}/kaldi-apple-silicon:arm64
          build-args: |
            TOOLS_JOBS=4
            NUM_JOBS=8
